<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>850 Olunca Haber Ver Ulan Usta Abi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#10303b; --bg2:#0a1f28; --cream:#fff3d4; --amber:#ffbf3f; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100svh;
    display: grid; place-items: center;
    padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.25rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
    background:
      radial-gradient(60% 45% at 50% 62%, rgba(255,191,63,.18), transparent 70%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    color: var(--cream);
    font-family: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: clamp(1.4rem, 5vh, 2.6rem); width: 100%; max-width: 560px; }
  h1 { text-align: center; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }
  h1 .big { display: block; font-size: clamp(3.6rem, 19vw, 7rem); line-height: .95; color: var(--amber); }
  h1 .rest { display: block; margin-top: .6rem; font-size: clamp(1.35rem, 6.2vw, 2.1rem); line-height: 1.2; font-weight: 700; }
  .toast { width: min(72vw, 340px); }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .steam path { fill: none; stroke: var(--cream); stroke-width: 6; stroke-linecap: round; opacity: 0; animation: rise 3.2s ease-in infinite; }
  .steam path:nth-child(2) { animation-delay: 1s; }
  .steam path:nth-child(3) { animation-delay: 2s; }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(14px); }
    30% { opacity: .55; }
    100% { opacity: 0; transform: translateY(-24px); }
  }
  @media (prefers-reduced-motion: reduce) { .steam path { animation: none; opacity: .35; } }
</style>
</head>
<body>
<main>
  <h1><span class="big">850</span><span class="rest">Olunca Haber Ver Ulan Usta Abi</span></h1>

  <div class="toast" role="img" aria-label="Ekmek arasında kaşarlı sucuklu tost">
    <svg viewBox="0 -40 340 380" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="slice" d="M50 95 C30 90 28 50 70 40 C110 28 190 28 230 40 C272 50 270 90 250 95 C256 130 252 180 248 240 Q246 262 225 262 H75 Q54 262 52 240 C48 180 44 130 50 95 Z"/>
        <clipPath id="sliceClip"><use href="#slice"/></clipPath>
        <linearGradient id="crumb" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fbf0cd"/>
          <stop offset="1" stop-color="#f0dca6"/>
        </linearGradient>
        <filter id="pores" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
          <feColorMatrix in="n" type="matrix" values="0 0 0 0 .7  0 0 0 0 .55  0 0 0 0 .3  0 0 0 -2.2 1.35"/>
        </filter>
        <g id="bread">
          <use href="#slice" fill="url(#crumb)"/>
          <g clip-path="url(#sliceClip)">
            <rect x="20" y="20" width="260" height="260" filter="url(#pores)" opacity=".55"/>
            <use href="#slice" fill="none" stroke="#d29a4e" stroke-width="20"/>
            <use href="#slice" fill="none" stroke="#f0c37a" stroke-width="6" opacity=".6"/>
          </g>
        </g>
      </defs>

      <!-- steam -->
      <g class="steam">
        <path d="M130 -2 q-12 -14 0 -28 q12 -14 0 -28" transform="translate(0 18)"/>
        <path d="M170 -8 q-12 -14 0 -28 q12 -14 0 -28" transform="translate(0 18)"/>
        <path d="M210 -2 q-12 -14 0 -28 q12 -14 0 -28" transform="translate(0 18)"/>
      </g>

      <ellipse cx="170" cy="318" rx="130" ry="10" fill="#041015" opacity=".5"/>

      <!-- back slice -->
      <g transform="translate(14 8) rotate(-6 150 150)" opacity=".92"><use href="#bread"/></g>

      <!-- filling -->
      <g transform="translate(0 0)">
        <path d="M62 150 Q60 128 84 126 H262 Q288 128 286 152 L284 296 Q270 312 258 296 Q246 316 230 298 Q214 312 200 298 Q182 316 166 298 Q150 312 134 298 Q118 314 104 298 Q86 312 66 298 Z" fill="#ffd24d"/>
        <path d="M62 150 Q60 128 84 126 H262 Q288 128 286 152" fill="none" stroke="#e8aa1f" stroke-width="3" opacity=".6"/>
        <g fill="#a3281d" stroke="#6b150e" stroke-width="2">
          <ellipse cx="286" cy="190" rx="13" ry="26"/>
          <ellipse cx="60" cy="214" rx="12" ry="24"/>
        </g>
      </g>

      <!-- front slice -->
      <g transform="translate(20 28) rotate(2 150 150)"><use href="#bread"/></g>
    </svg>
  </div>
</main>
</body>
</html>
